# Keeps this repo's main in step with Rencieyyyy/AniMartAdmin main.
# Hostinger deploys this repo on every push to main, so each sync that
# brings in new commits also redeploys animart.site.
name: Sync from Rencieyyyy/AniMartAdmin

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a little late)
  workflow_dispatch:          # "Run workflow" button for an immediate sync

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/Rencieyyyy/AniMartAdmin.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git merge --no-edit -m "Sync from Rencieyyyy/AniMartAdmin main" FETCH_HEAD
          git push origin main
